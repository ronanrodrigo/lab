<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Shopping com IA - 12 Ideias Revolucionárias</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>🤖 Live Shopping com IA</h1>
      <p class="subtitle">12 ideias para transformar plataformas de vendas ao vivo com inteligência artificial</p>
    </div>
  </header>

  <nav class="nav">
    <div class="container">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="agentes">Agentes</button>
        <button class="filter-btn" data-filter="recomendacao">Recomendação</button>
        <button class="filter-btn" data-filter="nlp">NLP</button>
        <button class="filter-btn" data-filter="ml">Machine Learning</button>
        <button class="filter-btn" data-filter="seguranca">Segurança</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="ideas-grid" id="ideasGrid">
      <!-- Cards serão inseridos aqui via JavaScript -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Ideias desenvolvidas com base em pesquisa de IA e e-commerce</p>
      <p><a href="https://github.com/ronanrodrigo/lab">GitHub Lab</a> | <a href="https://ronanrodrigo.dev">ronanrodrigo.dev</a></p>
    </div>
  </footer>

  <!-- Modal para detalhes -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
