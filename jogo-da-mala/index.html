<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <meta name="description" content="Malinha Mágica: um jogo cozy para montar malas para aventuras.">
  <title>Malinha Mágica — Jogo da Mala</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="ambient-canvas" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" id="brand-home" aria-label="Voltar para o início">
        <span class="brand-mark" aria-hidden="true">🧳</span>
        <span>Malinha <strong>Mágica</strong></span>
      </a>
      <div class="top-actions">
        <div class="wallet" aria-label="Saldo de moedas mágicas">
          <span aria-hidden="true">✦</span>
          <strong id="balance">60</strong>
          <span>moedas</span>
        </div>
        <button class="icon-button" id="sound-toggle" type="button" aria-label="Desativar sons" aria-pressed="true">🔊</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <span>feito para brincar sem pressa</span>
      <span aria-hidden="true">✦</span>
      <span>malinha mágica</span>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Phaser é usado somente para o cenário ambiente. O jogo continua funcional sem o CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" defer onerror="window.PHASER_UNAVAILABLE = true"></script>
  <script src="./app.js" defer></script>
</body>
</html>
